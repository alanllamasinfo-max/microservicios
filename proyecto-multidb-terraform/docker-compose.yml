version: '3.8'

networks:
  app_network_internal:
    driver: bridge

volumes:
  mysql_data:
  postgres_data:
  es_data:
  mysql_scripts:
  postgres_scripts:

services:
  # --- Bases de Datos ---
  db_mysql_users:
    image: mysql:8.0
    container_name: db_mysql_users
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: users_db
    volumes:
      - mysql_scripts:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql
    networks:
      - app_network_internal
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  db_postgres_inventory:
    image: postgres:15-alpine
    container_name: db_postgres_inventory
    restart: always
    environment:
      POSTGRES_USER: admin_pg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: inventory_db
    volumes:
      - postgres_scripts:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_pg -d inventory_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- API Gateway Service ---
  api_gateway_service:
    build: ./user-service
    container_name: api_gateway_service
    restart: always
    ports:
      - "8001:8001"
    environment:
      MYSQL_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db_mysql_users:3306/users_db
      POSTGRES_URL: postgresql://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@db_postgres_inventory:5432/inventory_db
      ELASTICSEARCH_HOST: http://elasticsearch:9200
    depends_on:
      db_mysql_users:
        condition: service_healthy
      db_postgres_inventory:
        condition: service_healthy
      elasticsearch:
        condition: service_started
    networks:
      - app_network_internal

  # --- Monitoreo (ELK Stack) ---
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - app_network_internal

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - app_network_internal
